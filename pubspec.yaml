name: in_air_update
description: A lightweight Over-The-Air (OTA) patch and dynamic configuration manager for Flutter apps.
version: 1.0.1
homepage: https://github.com/SamiUllahOfficiale/in_air_update

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  hive_quick: ^1.0.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

topics:
  - ota
  - hotfix
  - updates
  - configuration
  - flutter
